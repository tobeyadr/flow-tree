<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flow-tree demo</title>
  <link rel="stylesheet" href="../src/flow-tree.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff; --text: #1d2327; --muted: #6b7280; --border: #dcdfe4; --panel: #fafbfc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101216; --text: #e8eaed; --muted: #9aa1ad; --border: #2c303a; --panel: #181b21; }
    }
    :root[data-theme="light"] { color-scheme: light; --bg: #fff; --text: #1d2327; --muted: #6b7280; --border: #dcdfe4; --panel: #fafbfc; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #101216; --text: #e8eaed; --muted: #9aa1ad; --border: #2c303a; --panel: #181b21; }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }

    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
    header h1 { margin: 0 12px 0 0; font-size: 15px; }
    header .spacer { flex: 1; }
    button, select { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    label.check { display: flex; align-items: center; gap: 6px; color: var(--muted); }

    main { display: flex; flex: 1; min-height: 0; }
    #flow { flex: 1; min-width: 0; }
    aside { display: flex; flex-direction: column; width: 340px; border-left: 1px solid var(--border); background: var(--panel); }
    aside section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    aside h2 { margin: 0 0 8px; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    aside input[type=text], aside input[type=number], aside select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    aside .field { margin-top: 10px; }
    aside .field:first-child { margin-top: 0; }
    aside .field label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
    aside .row { display: flex; gap: 8px; margin-top: 8px; }
    #json { flex: 1; min-height: 0; margin: 0; padding: 14px 16px; overflow: auto; font: 12px/1.5 ui-monospace, 'Cascadia Code', Consolas, monospace; white-space: pre; }
    #empty { color: var(--muted); }
    #log { color: var(--muted); font-size: 12px; }

    @media (max-width: 760px) {
      main { flex-direction: column; }
      aside { width: auto; max-height: 45%; border-left: 0; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<header>
  <h1>flow-tree</h1>
  <button id="undo" type="button">Undo</button>
  <button id="redo" type="button">Redo</button>
  <button id="reset" type="button">Reset</button>
  <span class="spacer"></span>
  <label class="check"><input id="readonly" type="checkbox"> Read-only</label>
  <select id="lines" aria-label="Connectors">
    <option value="straight">Lines: straight</option>
    <option value="curved">Lines: curved</option>
  </select>
  <select id="theme" aria-label="Theme">
    <option value="auto">Theme: auto</option>
    <option value="light">Theme: light</option>
    <option value="dark">Theme: dark</option>
  </select>
</header>

<main>
  <div id="flow"></div>

  <aside>
    <section>
      <h2>Selected node</h2>
      <div id="empty">Click a node. Drag one to move it.</div>
      <div id="inspector" hidden>
        <div class="field"><label for="title">Title</label><input id="title" type="text"></div>
        <!-- the settings of the node's type, built in the script below -->
        <div id="fields"></div>
        <div class="row">
          <button id="delete" type="button">Delete</button>
          <span id="log"></span>
        </div>
      </div>
    </section>
    <section style="padding-bottom: 0; border: 0"><h2>onChange(nodes)</h2></section>
    <pre id="json"></pre>
  </aside>
</main>

<noscript>
  <p style="padding: 24px">This demo needs JavaScript. If you're looking at a static preview of the file, run <code>npm run demo</code> and open <a href="http://localhost:5173/demo/">localhost:5173/demo/</a> instead.</p>
</noscript>

<script src="../dist/flow-tree.js"></script>
<script>
  if (typeof FlowTree === 'undefined') {

    // previews that show a file as a static snapshot (a data: URL) can't load ../dist, whether it's built or not
    const snapshot = !/^(https?|file):$/.test(location.protocol)

    document.getElementById('flow').innerHTML = snapshot
      ? '<p style="padding: 24px; line-height: 1.6">This looks like a static preview, which can\'t load <code>dist/flow-tree.js</code>.<br>Run <code>npm run demo</code> and open <a href="http://localhost:5173/demo/">localhost:5173/demo/</a>.</p>'
      // dist/ isn't in the repository, it's made by `npm run build`
      : '<p style="padding: 24px; line-height: 1.6">flow-tree hasn\'t been built yet, <code>dist/flow-tree.js</code> is missing.<br>Run <code>npm install</code> then <code>npm run build</code>, and reload.</p>'

    throw new Error('flow-tree isn\'t loaded, see the message on the page')
  }

  const types = {
    webhook: { name: 'Webhook received', group: 'Triggers', trigger: true, icon: '🪝', color: '#8b5cf6', description: 'Starts when a request arrives' },
    form   : { name: 'Form submitted',   group: 'Triggers', trigger: true, icon: '📝', color: '#8b5cf6', description: 'Starts when someone submits a form' },
    email  : { name: 'Send email',       group: 'Actions',  icon: '✉️', color: '#2563eb', description: 'Send a message' },
    // `title` works out what a node is called from the node. A title set on the node itself wins.
    tag    : { name: 'Apply tag', group: 'Actions', icon: '🏷️', color: '#0d9488', description: 'Add a tag to the contact',
             title: node => node.data?.tag && `Tag: ${ node.data.tag }` },
    wait   : { name: 'Wait', group: 'Actions', icon: '⏳', color: '#d97706', description: 'Pause before the next step',
             title: node => node.data?.amount && `Wait ${ node.data.amount } ${ node.data.unit ?? 'days' }` },
    if     : {
      name: 'If / else', group: 'Logic', icon: '🔀', color: '#16a34a', description: 'Branch on a condition',
      branches: [{ key: 'yes', name: 'Yes', color: '#16a34a' }, { key: 'no', name: 'No', color: '#dc2626' }],
    },
    split  : {
      name: 'Split test', group: 'Logic', icon: '🎲', color: '#16a34a', description: 'Send people down different paths',
      // branches can depend on the node's settings, change "Number of ways" in the panel to see it
      branches: node => Array.from({ length: node.data?.ways ?? 3 }, (_, i) => ({ key: `way${ i + 1 }`, name: String.fromCharCode(65 + i) })),
    },
    stop   : { name: 'Stop', group: 'Logic', icon: '⛔', color: '#dc2626', description: 'End the flow here', terminal: true },
  }

  // The library doesn't know about settings. They're whatever you keep on the node, here in node.data, and this
  // says which fields the panel shows for each type.
  const fields = {
    form   : [{ key: 'form', label: 'Form', kind: 'text' }],
    webhook: [{ key: 'path', label: 'Path', kind: 'text' }],
    email  : [{ key: 'subject', label: 'Subject', kind: 'text' }],
    tag    : [{ key: 'tag', label: 'Tag', kind: 'text' }],
    wait   : [{ key: 'amount', label: 'Wait for', kind: 'number', min: 1 }, { key: 'unit', label: 'Unit', kind: 'select', options: ['minutes', 'hours', 'days'] }],
    if     : [{ key: 'check', label: 'Check whether the contact', kind: 'select', options: ['opened the email', 'clicked a link', 'has a tag'] }],
    split  : [{ key: 'ways', label: 'Number of ways', kind: 'number', min: 2, max: 5 }],
  }

  // what a card says under its title, from the settings
  const summaries = {
    form   : d => d.form,
    webhook: d => d.path,
    email  : d => d.subject,
    if     : d => d.check && `If they ${ d.check }`,
    split  : d => `${ d.ways ?? 3 } ways`,
  }

  const initial = () => [
    { id: 'start', type: 'form', title: 'Newsletter signup', data: { form: 'Footer form' } },
    // triggers next to each other are an OR group, each can have steps that only run after it
    { id: 'hook', type: 'webhook', title: 'Zapier webhook', data: { path: '/hooks/zapier' } },
    { id: 'zap-tag', type: 'tag', parent: 'hook', data: { tag: 'from-zapier' } },
    { id: 'welcome', type: 'email', title: 'Welcome email', data: { subject: 'Welcome aboard!' } },
    { id: 'check', type: 'if', title: 'Opened the email?', data: { check: 'opened the email' } },
    { id: 'tag-yes', type: 'tag', parent: 'check', branch: 'yes', data: { tag: 'engaged' } },
    { id: 'wait-no', type: 'wait', parent: 'check', branch: 'no', data: { amount: 3, unit: 'days' } },
    { id: 'nudge', type: 'email', title: 'Nudge email', parent: 'check', branch: 'no', data: { subject: 'Did you see this?' } },
    { id: 'bye', type: 'stop', parent: 'check', branch: 'no' },
    { id: 'ab', type: 'split', title: 'Subject line test', data: { ways: 3 } },
    { id: 'a', type: 'email', title: 'Version A', parent: 'ab', branch: 'way1', data: { subject: 'Big news' } },
    { id: 'b', type: 'email', title: 'Version B', parent: 'ab', branch: 'way2', data: { subject: 'Quick question' } },
    { id: 'followup', type: 'email', title: 'Follow up', locked: true, data: { subject: 'Anything I can help with?' } },
  ]

  const $ = id => document.getElementById(id)

  const div = (className, text) => Object.assign(document.createElement('div'), { className, textContent: text })

  const flow = FlowTree.mount('#flow', {
    nodes: initial(),
    types,

    // the card's contents, redrawn whenever a node changes, so editing a setting shows on the card right away
    renderNode: (node, type, title) => {
      const sub = summaries[node.type]?.(node.data ?? {}) || type?.name
      return [div('ft-title', title), sub && sub !== title ? div('ft-sub', sub) : null]
    },

    onChange: (nodes, change) => {
      show(nodes)
      $('log').textContent = change.type
      sync()
      // undo and redo change settings too, so keep the panel in step. Not the field being typed in, for
      // updates that came from it
      inspect(flow.getSelected(), change.type !== 'update')
    },

    // open the panel for the node that was clicked
    onSelect: node => inspect(node),
  })

  const show = nodes => $('json').textContent = JSON.stringify(nodes, null, 2)

  const sync = () => {
    $('undo').disabled = !flow.canUndo()
    $('redo').disabled = !flow.canRedo()
  }

  // ---- the settings panel

  // the node the fields were built for, they're only rebuilt when it's another
  let shown = null

  const inspect = (node, force = false) => {

    $('empty').hidden = Boolean(node)
    $('inspector').hidden = !node
    $('delete').disabled = Boolean(node?.locked)

    if (!node) {
      shown = null
      return
    }

    if (shown !== node.id) {
      shown = node.id
      build(node)
    }

    // fill in the values, but not the one being typed in unless something else changed it
    const set = (input, value) => {
      if (force || document.activeElement !== input) input.value = value ?? ''
    }

    // empty means the node uses the title its type gives it, which is what the placeholder says
    $('title').placeholder = flow.getTitle(node.id)
    set($('title'), node.title)
    ;( fields[node.type] ?? [] ).forEach(field => set($(`field-${ field.key }`), node.data?.[field.key]))
  }

  const build = node => {

    $('fields').replaceChildren(...( fields[node.type] ?? [] ).map(field => {

      const input = field.kind === 'select'
        ? Object.assign(document.createElement('select'), { innerHTML: field.options.map(o => `<option>${ o }</option>`).join('') })
        : Object.assign(document.createElement('input'), { type: field.kind, min: field.min ?? '', max: field.max ?? '' })

      input.id = `field-${ field.key }`

      input.addEventListener('input', () => {

        const current = flow.getSelected()
        const value = field.kind === 'number' ? input.valueAsNumber : input.value

        // ignore what's half typed, or out of range
        if (!current || ( field.kind === 'number' && !( value >= ( field.min ?? -Infinity ) && value <= ( field.max ?? Infinity ) ) )) {
          return
        }

        // update() replaces whole fields, so spread the rest of node.data to keep it.
        // One undo step for a burst of typing in the same field.
        flow.update(current.id, { data: { ...current.data, [field.key]: value } }, { coalesce: `${ current.id }:${ field.key }` })
      })

      const wrap = div('field')
      const label = Object.assign(document.createElement('label'), { htmlFor: input.id, textContent: field.label })

      wrap.append(label, input)

      return wrap
    }))
  }

  $('title').addEventListener('input', e => {
    const node = flow.getSelected()
    if (node) flow.update(node.id, { title: e.target.value }, { coalesce: `${ node.id }:title` })
  })

  $('delete').addEventListener('click', () => {
    const node = flow.getSelected()
    if (node) flow.remove(node.id)
  })

  $('undo').addEventListener('click', () => flow.undo())
  $('redo').addEventListener('click', () => flow.redo())
  $('reset').addEventListener('click', () => { flow.setNodes(initial()); show(flow.getNodes()); sync(); inspect(null) })
  $('readonly').addEventListener('change', e => flow.setReadOnly(e.target.checked))
  $('lines').addEventListener('change', e => flow.setConnectors(e.target.value))
  $('theme').addEventListener('change', e => {
    flow.setTheme(e.target.value)
    document.documentElement.dataset.theme = e.target.value === 'auto' ? '' : e.target.value
  })

  show(flow.getNodes())
  sync()

  // handy in the console
  window.flow = flow
</script>
</body>
</html>
